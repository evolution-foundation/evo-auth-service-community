name: Publish Image Tags
description: >-
  Joins the per-architecture digests into one manifest and tags it for the ref:
  v* tag -> :X.Y.Z and :latest; main -> :latest and :main-<short>;
  develop -> :develop and :develop-<short>.

inputs:
  image:
    required: true
  registry-username:
    required: true
  registry-password:
    required: true

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        pattern: digest-*
        path: /tmp/digests
        merge-multiple: true

    - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

    - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
      with:
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    - name: Create and push the multi-arch manifest
      shell: bash
      working-directory: /tmp/digests
      env:
        IMAGE: ${{ inputs.image }}
      run: |
        set -euo pipefail
        short="${GITHUB_SHA:0:7}"
        case "$GITHUB_REF" in
          refs/tags/v*)        tags=("$IMAGE:${GITHUB_REF_NAME#v}" "$IMAGE:latest") ;;
          refs/heads/main)     tags=("$IMAGE:latest" "$IMAGE:main-$short") ;;
          refs/heads/develop)  tags=("$IMAGE:develop" "$IMAGE:develop-$short") ;;
          *) echo "::error::unexpected ref $GITHUB_REF"; exit 1 ;;
        esac
        args=()
        for t in "${tags[@]}"; do args+=(-t "$t"); done
        docker buildx imagetools create "${args[@]}" $(printf "$IMAGE@sha256:%s " *)
        echo "Published: ${tags[*]}"
