name: Check Syntax
description: RuboCop against the debt frozen in .rubocop_todo.yml; any offense outside it fails.

runs:
  using: composite
  steps:
    - uses: ruby/setup-ruby@145243922b4465b78e04dd66294782c7de45901f # v1.345.0
      with:
        bundler-cache: true

    - name: RuboCop
      shell: bash
      run: bundle exec rubocop --format github --format progress
