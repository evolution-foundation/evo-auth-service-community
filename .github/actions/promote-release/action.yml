name: Promote Release
description: >-
  On main: the image of the RC that main is identical to gets X.Y.Z and :latest
  without a rebuild, then the vX.Y.Z tag and the final GitHub release are
  created. Both steps can be re-run: a run that failed halfway is completed by
  re-running it. The image config keeps the RC version label, since changing it
  would make a different image; the final version is in the tags and the index
  annotation.

inputs:
  image:
    required: true
  source-tag:
    description: vX.Y.Z-rc.N whose image is promoted.
    required: true
  release-tag:
    description: vX.Y.Z to create.
    required: true
  notes-start:
    default: ""
  registry-username:
    required: true
  registry-password:
    required: true
  token:
    description: Token with contents:write.
    required: true

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

    - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
      with:
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    - name: Tag the tested RC image as the final version
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        SOURCE: ${{ inputs.source-tag }}
        FINAL: ${{ inputs.release-tag }}
      run: |
        set -euo pipefail
        src="$IMAGE:${SOURCE#v}"
        docker buildx imagetools create \
          --annotation "index:org.opencontainers.image.version=${FINAL#v}" \
          -t "$IMAGE:${FINAL#v}" -t "$IMAGE:latest" "$src"
        echo "Promoted $src to $IMAGE:${FINAL#v} and $IMAGE:latest"
        docker buildx imagetools inspect "$src" --format '{{json .Manifest.Digest}}'

    - name: Create the tag and the final release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        TAG: ${{ inputs.release-tag }}
        NOTES_START: ${{ inputs.notes-start }}
      run: |
        set -euo pipefail
        if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          target=$(git rev-parse -q --verify "refs/tags/$TAG^{commit}" || true)
          [ "$target" = "$GITHUB_SHA" ] || { echo "::error::$TAG already exists on another commit"; exit 1; }
          echo "$TAG already released from this commit; nothing to do."; exit 0
        fi
        start=(); [ -n "$NOTES_START" ] && start=(--notes-start-tag "$NOTES_START")
        gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
          --title "$TAG" --generate-notes "${start[@]}" --latest
