name: Application Tests
description: >-
  The whole RSpec suite minus ci/test-exceptions.txt; a skipped example fails.
  Postgres and Redis are services of the calling job.

runs:
  using: composite
  steps:
    - uses: ruby/setup-ruby@145243922b4465b78e04dd66294782c7de45901f # v1.345.0
      with:
        bundler-cache: true

    - name: Prepare database
      shell: bash
      run: bundle exec rails db:create db:schema:load

    - name: RSpec
      shell: bash
      run: ci/rspec
