name: Pipeline Status
description: >-
  Fails when any job of the run is not green. A job may be skipped only when it
  does not apply: publish-pr runs on internal pull requests to develop/main;
  version on pushes; the image build on pushes that build (develop, release);
  release-candidate on pushes to release branches; promote on the merge of a
  release branch into main; release-dry-run on pull requests into main.

inputs:
  results:
    description: toJSON(needs) of the calling job.
    required: true
  publish-mode:
    description: mode output of Resolve Version (build, promote, none); empty on pull requests.
    default: ""

runs:
  using: composite
  steps:
    - name: Every check passed
      shell: bash
      env:
        RESULTS: ${{ inputs.results }}
        EVENT: ${{ github.event_name }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        BASE: ${{ github.base_ref }}
        MODE: ${{ inputs.publish-mode }}
      run: |
        echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
        pr=false
        if [ "$EVENT" = pull_request ] && [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ] \
           && { [ "$BASE" = develop ] || [ "$BASE" = main ]; }; then pr=true; fi
        push=false; [ "$EVENT" = push ] && push=true
        release=false; [[ "$GITHUB_REF" == refs/heads/release/* ]] && [ "$push" = true ] && release=true
        build=false; [ "$push" = true ] && [ "$MODE" = build ] && build=true
        promote=false; [ "$push" = true ] && [ "$MODE" = promote ] && promote=true
        dryrun=false; [ "$EVENT" = pull_request ] && [ "$BASE" = main ] && dryrun=true
        bad=$(echo "$RESULTS" | jq -r --argjson pr "$pr" --argjson push "$push" --argjson release "$release" \
                --argjson build "$build" --argjson promote "$promote" --argjson dryrun "$dryrun" '
          def expected: if .key == "publish-pr" then $pr
            elif .key == "version" then $push
            elif .key == "publish-arch" or .key == "publish-tags" then $build
            elif .key == "release-candidate" then $release
            elif .key == "promote" then $promote
            elif .key == "release-dry-run" then $dryrun
            else true end;
          to_entries[]
          | select(.value.result != "success")
          | select((.value.result == "skipped" and (expected | not)) | not)
          | .key')
        if [ -n "$bad" ]; then
          echo "::error::not green: $(echo $bad)"
          exit 1
        fi
