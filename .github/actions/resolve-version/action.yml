name: Resolve Version
description: >-
  The version of this run and what to publish. release/X.Y is the only human
  choice (X: a change that needs action from whoever installs; Y: every regular
  cut). Z and rc.N are computed: a new line starts at X.Y.0, an urgent fix on a
  released line is the last final + 1, and every push on the branch tip is the
  next rc.N (a re-run on a commit that already has an RC reuses it). main is the
  only trigger of a final version: main must be identical to a tested RC, which
  is then promoted. Needs a checkout with full history.

inputs:
  ref:
    description: Ref to resolve as; defaults to the ref of the run. Release Dry Run passes refs/heads/main.
    default: ""

outputs:
  mode:
    description: build (develop, release/X.Y) or promote (main).
    value: ${{ steps.resolve.outputs.mode }}
  version:
    description: X.Y.Z-rc.N on release branches, X.Y.Z on main, <ref>-<short> on develop.
    value: ${{ steps.resolve.outputs.version }}
  release-tag:
    description: vX.Y.Z-rc.N on release branches, vX.Y.Z on main.
    value: ${{ steps.resolve.outputs.release_tag }}
  source-tag:
    description: On main, the RC tag whose image is promoted.
    value: ${{ steps.resolve.outputs.source_tag }}
  notes-start:
    description: Highest final version below this one, where the release notes start.
    value: ${{ steps.resolve.outputs.notes_start }}

runs:
  using: composite
  steps:
    - name: Resolve
      id: resolve
      shell: bash
      env:
        REF_INPUT: ${{ inputs.ref }}
      run: |
        set -euo pipefail
        # GITHUB_* variables cannot be overridden, so the ref comes in as an input.
        GITHUB_REF=${REF_INPUT:-$GITHUB_REF}
        GITHUB_REF_NAME=${GITHUB_REF#refs/heads/}
        git fetch --force --tags --quiet
        short=${GITHUB_SHA:0:7}
        mode=build release_tag= source_tag= target=
        # Only well-formed tags are read, so a tag name never reaches arithmetic
        # or the shell unvalidated.
        n='(0|[1-9][0-9]*)'
        finals() { git tag --list 'v*' | grep -E "^v$n\.$n\.$n\$" | sort -V || true; }
        rcs() { git tag --list 'v*' | grep -E "^v$n\.$n\.$n-rc\.$n\$" | sort -V || true; }

        case "$GITHUB_REF" in
          refs/heads/release/*)
            line=${GITHUB_REF_NAME#release/}
            [[ "$line" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "::error::release branches are named release/X.Y (no leading zeros), got $GITHUB_REF_NAME"; exit 1; }
            esc=${line//./\\.}
            release_tag=$(git tag --points-at HEAD | grep -E "^v$esc\.$n-rc\.$n\$" | sort -V | tail -1 || true)
            if [ -z "$release_tag" ]; then
              # A re-run of an older push must not publish stale code under a new number.
              tip=$(git rev-parse -q --verify "refs/remotes/origin/$GITHUB_REF_NAME" || true)
              [ "$tip" = "$GITHUB_SHA" ] || { echo "::error::$short is not the tip of $GITHUB_REF_NAME; only the tip gets a new candidate"; exit 1; }
              last_final=$(finals | grep -E "^v$esc\." | tail -1 || true)
              if [ -n "$last_final" ]; then base="$line.$(( ${last_final##*.} + 1 ))"; else base="$line.0"; fi
              last_rc=$(rcs | grep -E "^v${base//./\\.}-rc\." | tail -1 || true)
              rc_n=0; [ -z "$last_rc" ] || rc_n=${last_rc##*.}
              release_tag="v$base-rc.$(( rc_n + 1 ))"
            fi
            version=${release_tag#v}
            target=${version%-rc.*} ;;
          refs/heads/main)
            # The candidate is found by content, not by branch or merge parents, so
            # merge commits, squash and rebase all work, and the release branch may
            # already be gone. Anything that is not a tested candidate fails.
            head_tree=$(git rev-parse 'HEAD^{tree}')
            for t in $(rcs | sort -rV); do
              if [ "$(git rev-parse "$t^{tree}")" = "$head_tree" ]; then source_tag=$t; break; fi
            done
            [ -n "$source_tag" ] || { echo "::error::main is not identical to any tested release candidate; main only receives release/X.Y branches"; exit 1; }
            release_tag=${source_tag%-rc.*}
            # Only the last candidate of a version is the one approved for release.
            last_rc=$(rcs | grep -E "^${release_tag//./\\.}-rc\." | tail -1)
            [ "$last_rc" = "$source_tag" ] || { echo "::error::main matches $source_tag, but the last candidate of $release_tag is $last_rc; only the last candidate is promoted"; exit 1; }
            if git rev-parse -q --verify "refs/tags/$release_tag" >/dev/null; then
              # A re-run after the tag was created is fine only on the same commit.
              [ "$(git rev-parse "$release_tag^{commit}")" = "$GITHUB_SHA" ] || { echo "::error::$release_tag already exists on another commit"; exit 1; }
            fi
            mode=promote version=${release_tag#v} target=$version ;;
          *) version="$GITHUB_REF_NAME-$short" ;;
        esac

        notes_start=
        if [ -n "$target" ]; then
          for t in $(finals); do
            [ "$t" = "v$target" ] && break
            [ "$(printf '%s\n%s\n' "$t" "v$target" | sort -V | head -1)" = "$t" ] && notes_start=$t
          done
        fi
        {
          echo "mode=$mode"
          echo "version=$version"
          echo "release_tag=$release_tag"
          echo "source_tag=$source_tag"
          echo "notes_start=$notes_start"
        } >> "$GITHUB_OUTPUT"
        echo "mode=$mode version=$version release_tag=$release_tag source_tag=$source_tag notes_start=$notes_start"
