name: Pipeline

# The only workflow of this repository: triggers, order and services. What each
# check does lives in .github/actions/<check>/action.yml. The image is published
# only after every check, and "Pipeline Status" is the single required check on
# protected branches. Checks and debt files: ci/README.md.
on:
  pull_request:
  # Tags are created by this workflow (RC on release/X.Y, final on main) and
  # never trigger it; a tag pushed by hand publishes nothing.
  push:
    branches: [develop, main, "release/**"]

permissions:
  contents: read

# One queue per pull request and per branch; on main one per commit, so a
# pending promotion is never replaced by a later push.
concurrency:
  group: pipeline-${{ github.event.pull_request.number || (github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: evoapicloud/evo-auth-service-community
  # Deploy images bake RAILS_ENV=production; the Dockerfile defaults to
  # development for the local compose.
  IMAGE_BUILD_ARGS: RAILS_ENV=production
  # Release candidates build from scratch: a cached layer once shipped an image
  # without fixes that were in the source. The final version reuses that image.
  NO_CACHE: ${{ startsWith(github.ref, 'refs/heads/release/') }}

# ubuntu-latest is 26.04, where setup-ruby has no Ruby 3.4.4.
jobs:
  syntax:
    name: Check Syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/check-syntax

  tests:
    name: Application Tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # SetupBootstrapService stores the survey_token in Redis; without one the
      # token comes back nil and setup_bootstrap_spec fails.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      REDIS_URL: redis://127.0.0.1:6379/1
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: postgres
      # Boot-time requirements, not secrets: config/initializers/doorkeeper.rb
      # aborts the boot without them. Fixed throwaway values keep runs reproducible.
      SECRET_KEY_BASE: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      DOORKEEPER_JWT_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/application-tests

  build:
    name: Build Application
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/build-application
        with:
          build-args: ${{ env.IMAGE_BUILD_ARGS }}
          rails-env: production
          no-cache: ${{ env.NO_CACHE }}

  migrations:
    name: Migration Version Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/migration-version-check

  boundary:
    name: Community Boundary Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/community-boundary-check

  publish-pr:
    name: Publish Image
    needs: [syntax, tests, build, migrations, boundary]
    # Internal pull requests only: a fork gets no registry credentials.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["develop", "main"]'), github.base_ref)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/publish-image
        with:
          mode: pull-request
          image: ${{ env.IMAGE_NAME }}
          version: pr-${{ github.event.pull_request.number }}
          revision: ${{ github.event.pull_request.head.sha }}
          build-args: ${{ env.IMAGE_BUILD_ARGS }}
          registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
          registry-password: ${{ secrets.DOCKERHUB_TOKEN }}

  version:
    name: Resolve Version
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      version: ${{ steps.resolve.outputs.version }}
      release-tag: ${{ steps.resolve.outputs.release-tag }}
      source-tag: ${{ steps.resolve.outputs.source-tag }}
      notes-start: ${{ steps.resolve.outputs.notes-start }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - id: resolve
        uses: ./.github/actions/resolve-version

  publish-arch:
    name: Publish Image
    needs: [syntax, tests, build, migrations, boundary, version]
    if: github.event_name == 'push' && needs.version.outputs.mode == 'build'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/publish-image
        with:
          mode: digest
          image: ${{ env.IMAGE_NAME }}
          arch: ${{ matrix.arch }}
          version: ${{ needs.version.outputs.version }}
          revision: ${{ github.sha }}
          build-args: ${{ env.IMAGE_BUILD_ARGS }}
          no-cache: ${{ env.NO_CACHE }}
          registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
          registry-password: ${{ secrets.DOCKERHUB_TOKEN }}

  publish-tags:
    name: Publish Image Tags
    needs: [publish-arch, version]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/publish-image-tags
        with:
          image: ${{ env.IMAGE_NAME }}
          version: ${{ needs.version.outputs.version }}
          registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
          registry-password: ${{ secrets.DOCKERHUB_TOKEN }}

  release-candidate:
    name: Publish Release Candidate
    needs: [publish-tags, version]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/release-candidate
        with:
          tag: ${{ needs.version.outputs.release-tag }}
          image: ${{ env.IMAGE_NAME }}
          notes-start: ${{ needs.version.outputs.notes-start }}
          token: ${{ secrets.GITHUB_TOKEN }}

  promote:
    name: Promote Release
    needs: [syntax, tests, build, migrations, boundary, version]
    if: github.event_name == 'push' && needs.version.outputs.mode == 'promote'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/promote-release
        with:
          image: ${{ env.IMAGE_NAME }}
          source-tag: ${{ needs.version.outputs.source-tag }}
          release-tag: ${{ needs.version.outputs.release-tag }}
          notes-start: ${{ needs.version.outputs.notes-start }}
          registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
          registry-password: ${{ secrets.DOCKERHUB_TOKEN }}
          token: ${{ secrets.GITHUB_TOKEN }}

  release-dry-run:
    name: Release Dry Run
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-24.04
    steps:
      # The pull request merge commit is what main would become.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/release-dry-run
        with:
          image: ${{ env.IMAGE_NAME }}

  status:
    name: Pipeline Status
    if: always()
    needs: [syntax, tests, build, migrations, boundary, version, publish-pr, publish-arch, publish-tags, release-candidate, promote, release-dry-run]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/pipeline-status
        with:
          results: ${{ toJSON(needs) }}
          publish-mode: ${{ needs.version.outputs.mode }}
