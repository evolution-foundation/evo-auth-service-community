name: Lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  rubocop:
    name: RuboCop
    # ubuntu-latest moved to 26.04, where setup-ruby has no Ruby 3.4.4.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # Known debt is frozen in .rubocop_todo.yml; any offense outside it fails.
      - name: RuboCop
        run: bundle exec rubocop --format github --format progress
